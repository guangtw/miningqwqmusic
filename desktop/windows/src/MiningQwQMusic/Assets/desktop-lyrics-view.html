<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>桌面歌词</title>
<style>
  /* Colours come from the player palette (ink and page background). The page itself stays
     fully transparent; every glyph sits on a halo of the player's background colour so the
     line reads the same on bright and dark desktops. No color-scheme here: a dark scheme
     makes Chromium paint an opaque dark canvas behind a transparent root. */
  :root {
    --ink: #111111;
    --bg: #f3f2ee;
    --size: 34px;
  }
  :root[data-theme='dark'] {
    --ink: #f1f0ec;
    --bg: #0d0d0e;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Space Grotesk', 'MiSans', 'HarmonyOS Sans SC', 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }

  /* Hover plate: only while unlocked, so the window can be found and dragged. */
  #plate {
    position: fixed;
    inset: 4px;
    border-radius: 18px;
    background: color-mix(in srgb, var(--bg) 58%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent);
    opacity: 0;
    transition: opacity 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: grab;
  }
  html:not(.locked) body:hover #plate,
  html.reveal:not(.locked) #plate {
    opacity: 1;
  }
  html.locked #plate {
    display: none;
  }
  #bar {
    position: absolute;
    top: 8px;
    left: 18px;
    right: 10px;
    height: 26px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #meta {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 12px;
    font-weight: 500;
    color: color-mix(in srgb, var(--ink) 62%, var(--bg));
  }
  #meta:empty::before {
    content: '桌面歌词';
  }
  #bar button {
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  #bar button:hover {
    background: color-mix(in srgb, var(--ink) 10%, transparent);
  }
  #bar svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #stage {
    position: fixed;
    top: 36px;
    left: 22px;
    right: 22px;
    bottom: 14px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 2px;
    pointer-events: none;
  }
  .line {
    display: grid;
    font-size: var(--size);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.3;
    transform-origin: left top;
  }
  .line > .layer {
    grid-area: 1 / 1;
    padding: 0 4px;
    margin: 0 -4px;
  }
  /* Halo: the glyph filled and blurred in the player background colour. The unlit part of the
     sweep is ink at 34% over it, which is exactly how the player paints it over its page. */
  .halo span {
    color: var(--bg);
    text-shadow:
      0 0 1px var(--bg),
      0 0 2px var(--bg),
      0 0 3px var(--bg),
      0 0 5px color-mix(in srgb, var(--bg) 80%, transparent),
      0 0 12px color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .ink span {
    color: var(--ink);
  }
  /* Current line lit left to right (--p written every frame), same gradient as refresh.css.
     The span stays inline so a wrapped line keeps lighting on its second row. */
  .primary.timed .ink span {
    color: transparent;
    background: linear-gradient(90deg, var(--ink) var(--p, 0%), color-mix(in srgb, var(--ink) 34%, transparent) calc(var(--p, 0%) + 7%));
    -webkit-background-clip: text;
    background-clip: text;
  }
  .primary.measure .layer {
    white-space: nowrap;
  }
  .secondary {
    font-size: calc(var(--size) * 0.62);
    font-weight: 600;
    letter-spacing: 0;
  }
  .secondary .layer {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .secondary .ink {
    opacity: 0.74;
  }
  .leaving {
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="plate">
  <div id="bar">
    <div id="meta"></div>
    <button type="button" data-action="lock" title="锁定歌词（鼠标会穿过歌词，可在托盘或设置里解锁）" aria-label="锁定桌面歌词">
      <svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>
    </button>
    <button type="button" data-action="close" title="关闭桌面歌词" aria-label="关闭桌面歌词">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
</div>
<div id="stage" aria-live="polite"></div>
<!-- view-script -->
</body>
</html>
