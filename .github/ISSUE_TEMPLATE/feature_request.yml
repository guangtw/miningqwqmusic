name: 功能建议
description: 描述希望改善的使用场景
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 描述实际使用场景和当前遇到的限制。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望如何改善？
      description: 可以描述交互、示例或替代方案。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 参考或补充
