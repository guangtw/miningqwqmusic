name: Windows client

on:
  push:
    tags: ['windows-v*']
  pull_request:
    paths: ['desktop/windows/**', '.github/workflows/windows-release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate native bridge and preferences
        run: |
          node --test tests/desktop-bridge.test.cjs tests/desktop-settings.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Bridge checks failed' }
          dotnet run --project tests/ShellPolicy.Tests/ShellPolicy.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Policy checks failed' }
      - name: Install packaging tools
        run: choco install innosetup --no-progress --yes
      - name: Package client
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^windows-v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '1.0.0' }
          .\scripts\package.ps1 -Version $version -SourceCommit $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: MiningQwQMusic-Windows-x64
          path: desktop/windows/artifacts/release/*
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'A verified release already exists; preserving its assets.'; exit 0 }
          $assets = (Get-ChildItem artifacts/release -File).FullName
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Mining唱片行 Windows $env:GITHUB_REF_NAME" --notes "Windows x64 客户端。下载 Setup.exe 安装，或解压 Portable.zip 直接运行。" --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
